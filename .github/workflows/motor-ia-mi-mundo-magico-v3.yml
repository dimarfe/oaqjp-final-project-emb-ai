name: Motor IA de Mi mundo Mágico v3

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mi-mundo-magico-v3-ai-worker
  cancel-in-progress: false

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_TEXT_DAILY_LIMIT: '50'
      AI_IMAGE_DAILY_LIMIT: '20'
      AI_VIDEO_DAILY_LIMIT: '5'
      AI_MAX_REQUESTS: '3'
    steps:
      - name: Descargar el trabajador de v3
        uses: actions/checkout@v6
        with:
          ref: mi-mundo-magico-v3
          fetch-depth: 1

      - name: Comprobar el código del trabajador
        shell: bash
        run: node --check .github/scripts/ai-worker-v3.mjs

      - name: Procesar los encargos de OpenAI
        shell: bash
        run: node .github/scripts/ai-worker-v3.mjs
