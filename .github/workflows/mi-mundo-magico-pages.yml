name: Validar Mi Mundo Mágico

on:
  push:
    branches:
      - mi-mundo-magico-web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-mi-mundo-magico
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://raw.githack.com/dimarfe/oaqjp-final-project-emb-ai/mi-mundo-magico-web/index.html
      API_URL: https://kfmyyvjkkhwpwubszmec.supabase.co/functions/v1/magic-world-api?action=health
    steps:
      - name: Descargar la rama de la aplicación
        uses: actions/checkout@v6

      - name: Comprobar el código y la ilustración
        shell: bash
        run: |
          set -euo pipefail
          cat chunks/app-gz-*.txt | tr -d '\r\n ' | base64 --decode | gzip --decompress > /tmp/mi-mundo-magico.js
          node --check /tmp/mi-mundo-magico.js
          for personaje in Elendil Feyre Glacial Chispa Zeus Riven Sky; do
            grep -q "$personaje" /tmp/mi-mundo-magico.js
          done
          cat chunks/image-*.txt | tr -d '\r\n ' | base64 --decode > /tmp/familia.webp
          test -s /tmp/familia.webp
          file /tmp/familia.webp | grep -qi 'Web/P'
          grep -q 'loader.js' index.html
          grep -q 'Mi Mundo Mágico' index.html

      - name: Comprobar la dirección pública y todos sus recursos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 "$PUBLIC_URL" -D /tmp/public-headers.txt -o /tmp/index-publico.html
          grep -q 'Mi Mundo Mágico' /tmp/index-publico.html
          BASE="${PUBLIC_URL%index.html}"
          for recurso in style.css loader.js manifest.json icon.svg sw.js chunks/app-gz-00.txt chunks/app-gz-01.txt chunks/image-00.txt chunks/image-01.txt chunks/image-02.txt chunks/image-03.txt chunks/image-04.txt; do
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "${BASE}${recurso}" -o "/tmp/$(echo "$recurso" | tr '/' '-')"
          done
          curl --fail --silent --show-error --location --retry 4 "$API_URL" | tee /tmp/api-health.json | grep -q '"ok":true'

      - name: Abrir la aplicación en Chrome y verificar la interfaz
        shell: bash
        run: |
          set -uo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME" || { echo '::error::Chrome no está instalado'; exit 1; }

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=30000 \
            --window-size=1440,1200 \
            --enable-logging=stderr \
            --dump-dom "$PUBLIC_URL" > /tmp/mi-mundo-magico-dom.html 2> /tmp/chrome-dom.log
          CHROME_STATUS=$?

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=30000 \
            --window-size=1440,1200 \
            --screenshot=/tmp/mi-mundo-magico.png \
            "$PUBLIC_URL" > /tmp/chrome-shot.log 2>&1
          SHOT_STATUS=$?

          echo '--- Elemento principal encontrado ---'
          grep -Eo '<div[^>]+id="app"[^>]*>' /tmp/mi-mundo-magico-dom.html | head -1 || true
          echo '--- Mensajes de arranque ---'
          grep -Eo 'No se pudo abrir Mi Mundo Mágico|Abriendo el mundo mágico|Panel del mundo' /tmp/mi-mundo-magico-dom.html | sort -u || true
          echo '--- Últimas líneas del registro de Chrome ---'
          tail -40 /tmp/chrome-dom.log || true

          FAIL=0
          check_text() {
            local text="$1"
            if grep -q "$text" /tmp/mi-mundo-magico-dom.html; then
              echo "✓ Encontrado: $text"
            else
              echo "::error::No se encontró en el DOM: $text"
              FAIL=1
            fi
          }

          [ "$CHROME_STATUS" -eq 0 ] || { echo "::error::Chrome dump-dom terminó con código $CHROME_STATUS"; FAIL=1; }
          [ "$SHOT_STATUS" -eq 0 ] || { echo "::error::Chrome screenshot terminó con código $SHOT_STATUS"; FAIL=1; }
          test -s /tmp/mi-mundo-magico.png || { echo '::error::No se generó la captura'; FAIL=1; }

          check_text 'id="app"'
          check_text 'Elendil'
          check_text 'Feyre'
          check_text 'Glacial'
          check_text 'Chispa'
          check_text 'Zeus'
          check_text 'Riven'
          check_text 'Sky'
          check_text 'Panel del mundo'
          check_text 'Personajes'

          if grep -q 'No se pudo abrir Mi Mundo Mágico' /tmp/mi-mundo-magico-dom.html; then
            echo '::error::El cargador mostró un error de apertura'
            FAIL=1
          fi
          if grep -q 'class="app hidden"' /tmp/mi-mundo-magico-dom.html; then
            echo '::error::La aplicación permaneció oculta después del arranque'
            FAIL=1
          fi
          exit "$FAIL"

      - name: Guardar diagnóstico de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-mi-mundo-magico
          path: |
            /tmp/mi-mundo-magico.png
            /tmp/mi-mundo-magico-dom.html
            /tmp/chrome-dom.log
            /tmp/chrome-shot.log
            /tmp/public-headers.txt
            /tmp/api-health.json
          if-no-files-found: warn
          retention-days: 7
