name: Publicar Mi mundo Mágico v2

on:
  push:
    branches:
      - mi-mundo-magico-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-mi-mundo-magico-v2
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama de la aplicación
        uses: actions/checkout@v6
        with:
          ref: mi-mundo-magico-v2
          fetch-depth: 0

      - name: Reconstruir y comprobar la aplicación
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mundo-v2
          mkdir -p /tmp/mundo-v2
          cat release/light/chunk-*.txt release/light/tail-*.txt | tr -d '\r\n ' | base64 --decode > /tmp/mundo-v2.tar.gz
          tar -xzf /tmp/mundo-v2.tar.gz -C /tmp/mundo-v2
          cp overlays/v2/ai-context.js /tmp/mundo-v2/ai-context.js
          python3 overlays/v2/patch_ai_context.py /tmp/mundo-v2

          test -s /tmp/mundo-v2/index.html
          test -s /tmp/mundo-v2/app.js
          test -s /tmp/mundo-v2/ai-context.js
          test -s /tmp/mundo-v2/styles.css
          node --check /tmp/mundo-v2/app.js
          node --check /tmp/mundo-v2/ai-context.js
          grep -q '<title>Mi mundo Mágico v2</title>' /tmp/mundo-v2/index.html
          grep -q 'data-route="ai-context"' /tmp/mundo-v2/index.html
          grep -q 'id="aiContextText"' /tmp/mundo-v2/index.html
          grep -q 'src="ai-context.js"' /tmp/mundo-v2/index.html
          for personaje in Elendil Feyre Glacial Chispa Zeus Riven Sky; do
            grep -q "$personaje" /tmp/mundo-v2/index.html
          done

      - name: Publicar la única versión v2 en GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dimarfe"
          git config user.email "45332405+dimarfe@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages /tmp/gh-pages origin/gh-pages
          rm -rf /tmp/gh-pages/v2
          mkdir -p /tmp/gh-pages/v2
          cp -a /tmp/mundo-v2/. /tmp/gh-pages/v2/
          touch /tmp/gh-pages/v2/.nojekyll
          cd /tmp/gh-pages
          git add -A v2
          if git diff --cached --quiet; then
            echo "La versión v2 ya estaba actualizada."
          else
            git commit -m "Añadir contexto completo para IA a Mi mundo Mágico v2"
            git push origin HEAD:gh-pages
          fi

      - name: Verificar la publicación y el mundo compartido
        shell: bash
        env:
          PUBLIC_URL: https://dimarfe.github.io/oaqjp-final-project-emb-ai/v2/
          API_URL: https://kfmyyvjkkhwpwubszmec.supabase.co/functions/v1/magic-world-api?action=health
        run: |
          set -euo pipefail
          for intento in {1..30}; do
            if curl --fail --silent --show-error --location "$PUBLIC_URL" -o /tmp/v2-publica.html && grep -q 'data-route="ai-context"' /tmp/v2-publica.html; then
              break
            fi
            sleep 5
          done
          grep -q '<title>Mi mundo Mágico v2</title>' /tmp/v2-publica.html
          grep -q 'data-route="ai-context"' /tmp/v2-publica.html
          grep -q 'id="aiContextText"' /tmp/v2-publica.html
          for recurso in app.js ai-context.js styles.css manifest.webmanifest sw.js assets/icon.svg assets/default-avatar.svg; do
            curl --fail --silent --show-error --location "${PUBLIC_URL}${recurso}" -o "/tmp/$(echo "$recurso" | tr '/' '-')"
          done
          node --check /tmp/ai-context.js
          grep -q 'CONTEXTO MAESTRO PARA IA' /tmp/ai-context.js
          for recurso in image-00.txt image-01.txt image-02.txt image-03.txt image-04.txt; do
            curl --fail --silent --show-error --location "https://dimarfe.github.io/oaqjp-final-project-emb-ai/chunks/${recurso}" -o "/tmp/${recurso}"
          done
          curl --fail --silent --show-error --location "$API_URL" | grep -q '"ok":true'
