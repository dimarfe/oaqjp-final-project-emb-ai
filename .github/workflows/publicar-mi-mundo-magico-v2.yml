name: Publicar Mi mundo Mágico v2

on:
  push:
    branches:
      - mi-mundo-magico-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-mi-mundo-magico-v2
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama de la aplicación
        uses: actions/checkout@v6
        with:
          ref: mi-mundo-magico-v2
          fetch-depth: 0

      - name: Reconstruir y comprobar la aplicación
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mundo-v2
          mkdir -p /tmp/mundo-v2
          cat release/light/chunk-*.txt release/light/tail-*.txt | tr -d '\r\n ' | base64 --decode > /tmp/mundo-v2.tar.gz
          tar -xzf /tmp/mundo-v2.tar.gz -C /tmp/mundo-v2

          cp overlays/v2/ai-context.js /tmp/mundo-v2/ai-context.js
          python3 - <<'PY'
          from pathlib import Path

          index = Path('/tmp/mundo-v2/index.html')
          html = index.read_text(encoding='utf-8')

          old_nav = '''        <button data-route="world"><i>🌈</i><span>Reglas del mundo</span></button>
        <button data-route="owner" id="ownerNav" class="hidden"><i>🔐</i><span>Ajustes del propietario</span></button>'''
          new_nav = '''        <button data-route="world"><i>🌈</i><span>Reglas del mundo</span></button>
        <button data-route="ai-context"><i>🧠</i><span>Contexto para IA</span></button>
        <button data-route="owner" id="ownerNav" class="hidden"><i>🔐</i><span>Ajustes del propietario</span></button>'''
          if 'data-route="ai-context"' not in html:
              if old_nav not in html:
                  raise SystemExit('No se encontró el punto del menú para Contexto IA')
              html = html.replace(old_nav, new_nav, 1)

          owner_marker = '      <section class="app-view" id="ownerView" data-view="owner">'
          context_section = '''      <section class="app-view" id="aiContextView" data-view="ai-context">
        <div class="page-heading"><div><span class="kicker">Canon completo · listo para copiar</span><h1>Contexto para IA</h1><p>Reúne automáticamente toda la información vigente de la aplicación: mundo, reglas, personajes, lugares, aventuras, escena activa, ajustes del estudio y biblioteca compartida.</p></div><div class="page-actions"><button class="button button-soft" id="refreshAiContextButton">↻ Actualizar</button><button class="button button-primary" id="copyAiContextButton">⧉ Copiar para un prompt</button></div></div>
        <div class="ai-context-grid">
          <aside class="ai-context-guide">
            <span class="pill">Texto preparado para modelos de IA</span>
            <h2>Cómo utilizarlo</h2>
            <ol><li>Elige el formato completo, compacto o JSON.</li><li>Pulsa <strong>Copiar para un prompt</strong>.</li><li>Pega el texto en ChatGPT o en otra herramienta creativa.</li><li>Añade al final únicamente el encargo nuevo: la ilustración, el capítulo, el vídeo o la escena que quieres crear.</li></ol>
            <div class="notice info">Los recursos multimedia codificados se sustituyen por una nota. Se conservan todos sus títulos, descripciones, prompts y metadatos útiles para la IA.</div>
          </aside>
          <div class="editor-card ai-context-card">
            <div class="ai-context-toolbar"><div class="ai-context-meta"><strong id="aiContextStatus">Preparando el canon…</strong><span id="aiContextCount"></span></div><label>Formato<select id="aiContextMode"><option value="complete">Completo: texto + JSON</option><option value="compact">Compacto para prompts</option><option value="json">Solo JSON estructurado</option></select></label><button class="button button-soft button-small" id="downloadAiContextButton">Descargar</button></div>
            <textarea class="ai-context-text" id="aiContextText" readonly spellcheck="false" aria-label="Contexto completo para inteligencia artificial"></textarea>
          </div>
        </div>
      </section>

'''
          if 'id="aiContextView"' not in html:
              if owner_marker not in html:
                  raise SystemExit('No se encontró el punto de inserción de la sección Contexto IA')
              html = html.replace(owner_marker, context_section + owner_marker, 1)

          if 'src="ai-context.js"' not in html:
              html = html.replace('  <script src="app.js" defer></script>', '  <script src="app.js" defer></script>\n  <script src="ai-context.js" defer></script>', 1)
          index.write_text(html, encoding='utf-8')

          sw = Path('/tmp/mundo-v2/sw.js')
          source = sw.read_text(encoding='utf-8')
          source = source.replace("const CACHE='mi-mundo-magico-v2-20260816-2';", "const CACHE='mi-mundo-magico-v2-ai-context-1';")
          if "'ai-context.js'" not in source:
              source = source.replace("'./','index.html','styles.css','app.js','manifest.webmanifest'", "'./','index.html','styles.css','app.js','ai-context.js','manifest.webmanifest'")
          sw.write_text(source, encoding='utf-8')
          PY

          test -s /tmp/mundo-v2/index.html
          test -s /tmp/mundo-v2/app.js
          test -s /tmp/mundo-v2/ai-context.js
          test -s /tmp/mundo-v2/styles.css
          node --check /tmp/mundo-v2/app.js
          node --check /tmp/mundo-v2/ai-context.js
          grep -q '<title>Mi mundo Mágico v2</title>' /tmp/mundo-v2/index.html
          grep -q 'data-route="ai-context"' /tmp/mundo-v2/index.html
          grep -q 'id="aiContextText"' /tmp/mundo-v2/index.html
          grep -q 'src="ai-context.js"' /tmp/mundo-v2/index.html
          for personaje in Elendil Feyre Glacial Chispa Zeus Riven Sky; do
            grep -q "$personaje" /tmp/mundo-v2/index.html
          done

      - name: Publicar la única versión v2 en GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dimarfe"
          git config user.email "45332405+dimarfe@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages /tmp/gh-pages origin/gh-pages
          rm -rf /tmp/gh-pages/v2
          mkdir -p /tmp/gh-pages/v2
          cp -a /tmp/mundo-v2/. /tmp/gh-pages/v2/
          touch /tmp/gh-pages/v2/.nojekyll
          cd /tmp/gh-pages
          git add -A v2
          if git diff --cached --quiet; then
            echo "La versión v2 ya estaba actualizada."
          else
            git commit -m "Añadir contexto completo para IA a Mi mundo Mágico v2"
            git push origin HEAD:gh-pages
          fi

      - name: Verificar la publicación y el mundo compartido
        shell: bash
        env:
          PUBLIC_URL: https://dimarfe.github.io/oaqjp-final-project-emb-ai/v2/
          API_URL: https://kfmyyvjkkhwpwubszmec.supabase.co/functions/v1/magic-world-api?action=health
        run: |
          set -euo pipefail
          for intento in {1..30}; do
            if curl --fail --silent --show-error --location "$PUBLIC_URL" -o /tmp/v2-publica.html && grep -q 'data-route="ai-context"' /tmp/v2-publica.html; then
              break
            fi
            sleep 5
          done
          grep -q '<title>Mi mundo Mágico v2</title>' /tmp/v2-publica.html
          grep -q 'data-route="ai-context"' /tmp/v2-publica.html
          grep -q 'id="aiContextText"' /tmp/v2-publica.html
          for recurso in app.js ai-context.js styles.css manifest.webmanifest sw.js assets/icon.svg assets/default-avatar.svg; do
            curl --fail --silent --show-error --location "${PUBLIC_URL}${recurso}" -o "/tmp/$(echo "$recurso" | tr '/' '-')"
          done
          node --check /tmp/ai-context.js
          grep -q 'CONTEXTO MAESTRO PARA IA' /tmp/ai-context.js
          for recurso in image-00.txt image-01.txt image-02.txt image-03.txt image-04.txt; do
            curl --fail --silent --show-error --location "https://dimarfe.github.io/oaqjp-final-project-emb-ai/chunks/${recurso}" -o "/tmp/${recurso}"
          done
          curl --fail --silent --show-error --location "$API_URL" | grep -q '"ok":true'
