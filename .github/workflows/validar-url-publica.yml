name: Validar URL pública de Mi Mundo Mágico

on:
  push:
    branches:
      - mi-mundo-magico-web
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-url:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://rawcdn.githack.com/dimarfe/oaqjp-final-project-emb-ai/e06571adb25b62e9a2fa6980c462dfd470946e23/index.html
      API_URL: https://kfmyyvjkkhwpwubszmec.supabase.co/functions/v1/magic-world-api?action=health
    steps:
      - name: Verificar recursos públicos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 -D /tmp/headers.txt "$PUBLIC_URL" -o /tmp/index.html
          grep -q '<title>Mi Mundo Mágico</title>' /tmp/index.html
          ! grep -q 'External Content Notice' /tmp/index.html
          BASE="${PUBLIC_URL%index.html}"
          for recurso in style.css loader.js manifest.json icon.svg sw.js chunks/app-gz-00.txt chunks/app-gz-01.txt chunks/image-00.txt chunks/image-01.txt chunks/image-02.txt chunks/image-03.txt chunks/image-04.txt; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${BASE}${recurso}" -o "/tmp/$(echo "$recurso" | tr '/' '-')"
          done
          curl --fail --silent --show-error --location --retry 5 "$API_URL" | tee /tmp/api.json | grep -q '"ok":true'

      - name: Diagnosticar en Chrome
        shell: bash
        run: |
          set +e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=30000 \
            --window-size=1440,1200 \
            --enable-logging=stderr \
            --dump-dom "$PUBLIC_URL" > /tmp/dom.html 2> /tmp/chrome.log
          DOM_STATUS=$?
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=30000 \
            --window-size=1440,1200 \
            --screenshot=/tmp/mi-mundo-magico.png \
            "$PUBLIC_URL" > /tmp/screenshot.log 2>&1
          SHOT_STATUS=$?
          echo "dump-dom=$DOM_STATUS screenshot=$SHOT_STATUS"
          echo '--- app ---'
          grep -Eo '<div[^>]+id="app"[^>]*>' /tmp/dom.html | head -1 || true
          echo '--- mensajes ---'
          grep -Eo 'External Content Notice|No se pudo abrir Mi Mundo Mágico|Abriendo el mundo mágico|Panel del mundo|Elendil' /tmp/dom.html | sort -u || true
          echo '--- loader errors ---'
          grep -Ei 'error|failed|refused|cors|decomp|content security' /tmp/chrome.log | tail -60 || true
          FAIL=0
          [ "$DOM_STATUS" -eq 0 ] || FAIL=1
          [ "$SHOT_STATUS" -eq 0 ] || FAIL=1
          test -s /tmp/mi-mundo-magico.png || FAIL=1
          grep -q 'id="app"' /tmp/dom.html || FAIL=1
          grep -q 'class="app hidden"' /tmp/dom.html && FAIL=1
          grep -q 'External Content Notice' /tmp/dom.html && FAIL=1
          grep -q 'No se pudo abrir Mi Mundo Mágico' /tmp/dom.html && FAIL=1
          for texto in 'Panel del mundo' Elendil Feyre Glacial Chispa Zeus Riven Sky; do
            grep -q "$texto" /tmp/dom.html || { echo "Falta: $texto"; FAIL=1; }
          done
          exit "$FAIL"

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-url-publica
          path: |
            /tmp/mi-mundo-magico.png
            /tmp/dom.html
            /tmp/chrome.log
            /tmp/screenshot.log
            /tmp/headers.txt
            /tmp/api.json
          if-no-files-found: warn
          retention-days: 7
